<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1526" />
  <title>SAQR — falcon over Asir</title>
  <meta name="description" content="A falcon over the Asir escarpment at last light. Ride thermals, dodge rock, keep flying." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b1526'/%3E%3Cpath d='M6 19c5-1 8-5 10-11 2 6 5 10 10 11-5 0-8 2-10 5-2-3-5-5-10-5z' fill='%23ffb454'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=tanker@400&f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="./assets/index-BauN9lgH.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-C1bOT6h7.css">
</head>
<body>
  <div id="app">
    <canvas id="gl"></canvas>

    <div id="hud" aria-live="off">
      <div class="hud-tl">
        <span class="lbl">Score</span>
        <span id="hud-score" class="num">0</span>
        <span class="best">best <b id="hud-best">0</b></span>
      </div>
      <div class="hud-tr">
        <span class="lbl">Speed</span>
        <span id="hud-speed" class="num sm">97</span>
        <span class="unit">km/h</span>
      </div>
      <div id="hud-lift">
        <span class="lbl">Lift</span>
        <div class="bar"><i id="hud-lift-bar"></i></div>
        <span id="hud-lift-num" class="num sm">+0</span>
      </div>
      <div id="toast"></div>
      <div id="pops"></div>
      <div id="hint" class="hint">drag to fly</div>
    </div>

    <section id="screen-title" class="screen is-on">
      <p class="kicker">Asir &middot; last light</p>
      <div class="mark">
        <span class="ar">صقر</span>
        <h1>SAQR</h1>
      </div>
      <p class="sub">The escarpment at sunset.<br>Catch the thermals, miss the rock.</p>
      <button id="btn-start" class="cta">Fly</button>
      <div class="hints">
        <span><b>Drag</b> to steer</span>
        <span><b>Pull down</b> to stoop</span>
        <span class="kb"><kbd>space</kbd> pause</span>
        <span class="kb"><kbd>esc</kbd> back</span>
      </div>
    </section>

    <section id="screen-over" class="screen">
      <p class="kicker">The mountain wins</p>
      <span class="final" id="final-score">0</span>
      <div class="stats">
        <div><span class="lbl">best</span><b id="final-best">0</b></div>
        <div><span class="lbl">thermals</span><b id="final-thermals">0</b></div>
        <div><span class="lbl">distance</span><b id="final-dist">0 m</b></div>
      </div>
      <button id="btn-retry" class="cta">Again</button>
    </section>

    <div id="stick" aria-hidden="true"><i></i></div>
    <button class="mute" data-mute aria-label="Toggle sound" aria-pressed="false">♪</button>
    <div id="loader"><span>SAQR</span></div>
  </div>
</body>
</html>
